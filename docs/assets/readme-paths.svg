<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <defs><linearGradient id="b" x2="1280" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#151D28"/><stop offset="1" stop-color="#191723"/></linearGradient><style>text{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}</style></defs>
  <rect width="1280" height="420" rx="20" fill="url(#b)"/>
  <text x="46" y="55" font-size="13" fill="#9DBAF4" letter-spacing="2">ONE SESSION. MANY PATHS.</text>
  <text x="46" y="100" font-size="29" font-weight="650" fill="#F3F5FB">同一棵树里探索，每次只沿自己的路径思考。</text>
  <path d="M168 231h52Q240 231 240 211v-21Q240 170 260 170h39M240 216v95Q240 331 260 331h39M445 170h55Q520 170 520 190v41Q520 251 540 251h45" stroke="#85AEFF" stroke-width="3"/>
  <path d="M240 236v75Q240 331 260 331h39" stroke="#6B5D80" stroke-width="3"/>
  <rect x="46" y="201" width="122" height="60" rx="12" fill="#293A55" stroke="#6E96D8"/><text x="67" y="238" font-size="18" fill="#D9E7FF">A · 总体架构</text>
  <rect x="299" y="140" width="146" height="60" rx="12" fill="#293A55" stroke="#6E96D8"/><text x="320" y="177" font-size="18" fill="#D9E7FF">B · 工具调用</text>
  <rect x="299" y="301" width="146" height="60" rx="12" fill="#282632" stroke="#625970"/><text x="320" y="338" font-size="18" fill="#B7ADCA">C · 上下文</text>
  <rect x="585" y="221" width="146" height="60" rx="12" fill="#2B4242" stroke="#6CAF9F"/><text x="606" y="258" font-size="18" fill="#C6EDE2">D · 参数校验</text>
  <text x="305" y="390" font-size="13" fill="#978CA8">旁支保留在树上，不进入 D 的历史路径</text>
  <rect x="805" y="142" width="429" height="226" rx="14" fill="#111720" stroke="#364458"/>
  <text x="831" y="178" font-size="14" fill="#98A6BC">当你从 B 提问，创建 D</text>
  <text x="831" y="222" font-size="25" font-weight="600" fill="#D7E6FF">模型历史  A → B → D</text>
  <path d="M831 244h375" stroke="#2E3C4E"/>
  <text x="831" y="276" font-size="15" fill="#B6C2D4">阅读区跟随同一条路径</text><text x="831" y="305" font-size="15" fill="#B6C2D4">分支摘要仅作用于相应的后代</text><text x="831" y="334" font-size="15" fill="#B6C2D4">原始回答与工具事件仍可回看</text>
</svg>
